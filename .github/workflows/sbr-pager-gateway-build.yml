name: Build SBR Pager Gateway Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - feature/sbr-pager-gateway-windows
      - feature/sbr-pager-gateway-admin-pin
    paths:
      - 'apps/sbr-pager-gateway/**'
      - '.github/workflows/sbr-pager-gateway-build.yml'

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/sbr-pager-gateway

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Install pinned WhatsApp runtime
        shell: pwsh
        run: |
          $cache = Join-Path $PWD 'runtime\puppeteer-cache'
          New-Item -ItemType Directory -Force $cache | Out-Null
          $env:PUPPETEER_CACHE_DIR = $cache
          Push-Location whatsapp
          npm install --no-audit --no-fund
          npx puppeteer browsers install chrome
          Pop-Location

      - name: Bundle Node runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force 'runtime\node' | Out-Null
          $node = (Get-Command node).Source
          Copy-Item $node 'runtime\node\node.exe' -Force
          Write-Host "Bundled Node from $node"

      - name: Embed System Link bootstrap
        shell: pwsh
        env:
          SYSTEM_LINK_PROVISION_URL: ${{ secrets.SBR_SYSTEM_LINK_PROVISION_URL }}
          SYSTEM_LINK_MESSAGE_ENDPOINT: ${{ secrets.SBR_SYSTEM_LINK_MESSAGE_ENDPOINT }}
          SYSTEM_LINK_PROVISION_TOKEN: ${{ secrets.SBR_SYSTEM_LINK_PROVISION_TOKEN }}
          SBR_APP_VERSION: 0.1.${{ github.run_number }}
        run: |
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:SYSTEM_LINK_PROVISION_URL)) { $missing += 'SBR_SYSTEM_LINK_PROVISION_URL' }
          if ([string]::IsNullOrWhiteSpace($env:SYSTEM_LINK_MESSAGE_ENDPOINT)) { $missing += 'SBR_SYSTEM_LINK_MESSAGE_ENDPOINT' }
          if ([string]::IsNullOrWhiteSpace($env:SYSTEM_LINK_PROVISION_TOKEN)) { $missing += 'SBR_SYSTEM_LINK_PROVISION_TOKEN' }

          if ($missing.Count -gt 0) {
            if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
              throw "Production/manual installer build mangler GitHub Actions secrets: $($missing -join ', ')"
            }
            Write-Warning "System Link bootstrap mangler: $($missing -join ', '). CI-testbuilden fortsætter uden auto-provisionering."
          }

          function Escape-Python([string]$value) {
            if ($null -eq $value) { return '' }
            return $value.Replace('\', '\\').Replace('"', '\"')
          }

          $config = @(
            "APP_VERSION = $([char]34)$(Escape-Python $env:SBR_APP_VERSION)$([char]34)",
            "SYSTEM_LINK_PROVISION_URL = $([char]34)$(Escape-Python $env:SYSTEM_LINK_PROVISION_URL)$([char]34)",
            "SYSTEM_LINK_MESSAGE_ENDPOINT = $([char]34)$(Escape-Python $env:SYSTEM_LINK_MESSAGE_ENDPOINT)$([char]34)",
            "SYSTEM_LINK_PROVISION_TOKEN = $([char]34)$(Escape-Python $env:SYSTEM_LINK_PROVISION_TOKEN)$([char]34)"
          )
          $config | Set-Content -Encoding UTF8 build_config.py

          if ($missing.Count -eq 0) {
            Write-Host 'System Link one-time bootstrap embedded in application.'
          }

      - name: Build Windows application
        run: pyinstaller --noconfirm --clean --windowed --name "SBR Pager Gateway" main.py

      - name: Add WhatsApp and browser runtimes to application
        shell: pwsh
        run: |
          $app = 'dist\SBR Pager Gateway'
          New-Item -ItemType Directory -Force "$app\whatsapp" | Out-Null
          Copy-Item 'whatsapp\bridge.js' "$app\whatsapp\bridge.js" -Force
          Copy-Item 'whatsapp\package.json' "$app\whatsapp\package.json" -Force
          Copy-Item 'whatsapp\node_modules' "$app\whatsapp\node_modules" -Recurse -Force
          Copy-Item 'runtime' "$app\runtime" -Recurse -Force

      - name: Smoke-check packaged layout
        shell: pwsh
        run: |
          $app = 'dist\SBR Pager Gateway'
          $required = @(
            "$app\SBR Pager Gateway.exe",
            "$app\runtime\node\node.exe",
            "$app\whatsapp\bridge.js",
            "$app\whatsapp\node_modules\@open-wa\wa-automate\package.json"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing packaged file: $path" }
          }
          & "$app\runtime\node\node.exe" --check "$app\whatsapp\bridge.js"

      - name: Create portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force 'installer-output' | Out-Null
          Compress-Archive -Path 'dist\SBR Pager Gateway\*' -DestinationPath 'installer-output\SBR-Pager-Gateway-Portable.zip' -Force

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
          }

      - name: Build Setup EXE
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' 'installer.iss'

      - name: Upload Setup EXE
        uses: actions/upload-artifact@v4
        with:
          name: SBR-Pager-Gateway-Setup
          path: apps/sbr-pager-gateway/installer-output/SBR-Pager-Gateway-Setup.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SBR-Pager-Gateway-Portable
          path: apps/sbr-pager-gateway/installer-output/SBR-Pager-Gateway-Portable.zip
          if-no-files-found: error
          retention-days: 14
