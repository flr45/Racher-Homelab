name: SBR Pager Gateway Windows

on:
  push:
    branches:
      - feature/sbr-pager-gateway-windows
      - feature/sbr-pager-gateway-events-stations
      - feature/sbr-pager-gateway-admin-system-link
      - feature/sbr-pager-gateway-admin-pin
      - feature/sbr-pager-gateway-modem-baileys-fix
      - feature/sbr-pager-gateway-baileys-loader-hotfix
    paths:
      - 'apps/sbr-pager-gateway/**'
      - '.github/workflows/sbr-pager-gateway-windows.yml'
  pull_request:
    paths:
      - 'apps/sbr-pager-gateway/**'
      - '.github/workflows/sbr-pager-gateway-windows.yml'

jobs:
  validate:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/sbr-pager-gateway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.1'

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m py_compile main.py modem.py storage.py sms_engine.py sms_pdu.py gsm0338.py policy.py management.py whatsapp_engine.py delivery.py whatsapp_ui.py station_events.py station_defaults.py stations_ui.py events_ui.py alarm_stats.py system_link.py admin_ui.py admin_auth.py admin_access_ui.py secure_store.py build_config.py tests/test_station_events.py tests/test_system_link.py tests/test_admin_auth.py

      - name: Import application modules
        run: python -c "import main, modem, storage, sms_engine, sms_pdu, gsm0338, policy, management, whatsapp_engine, delivery, whatsapp_ui, station_events, station_defaults, stations_ui, events_ui, alarm_stats, system_link, admin_ui, admin_auth, admin_access_ui, secure_store, build_config; print('SBR Pager Gateway imports OK')"

      - name: Run local gateway tests
        run: python -m unittest discover -s tests -v

      - name: Validate WhatsApp bridge JavaScript
        working-directory: apps/sbr-pager-gateway/whatsapp
        run: node --check bridge.js

      - name: Resolve and validate pinned Baileys runtime
        working-directory: apps/sbr-pager-gateway/whatsapp
        shell: pwsh
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          @'
          const imported = await import('@whiskeysockets/baileys');
          const common = imported?.default && typeof imported.default === 'object' ? imported.default : {};
          const makeWASocket = (typeof imported.default === 'function' && imported.default) || imported.makeWASocket || common.makeWASocket || common.default;
          const useMultiFileAuthState = imported.useMultiFileAuthState || common.useMultiFileAuthState;
          const Browsers = imported.Browsers || common.Browsers;
          if (typeof makeWASocket !== 'function') throw new Error('makeWASocket export missing');
          if (typeof useMultiFileAuthState !== 'function') throw new Error('useMultiFileAuthState export missing');
          if (!Browsers || typeof Browsers.windows !== 'function') throw new Error('Browsers.windows export missing');
          console.log('Baileys runtime exports OK');
          '@ | Set-Content -Encoding UTF8 validate-baileys.mjs
          node validate-baileys.mjs
