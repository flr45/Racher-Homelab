name: Build Control Center image

on:
  push:
    branches: [main]
    paths:
      - "apps/control-center/**"
      - ".github/workflows/control-center-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: apps/control-center
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/racher-homelab/control-center:latest
            ghcr.io/${{ github.repository_owner }}/racher-homelab/control-center:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
