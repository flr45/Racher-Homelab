name: Control Center CI

on:
  pull_request:
    paths:
      - "apps/control-center/**"
      - ".github/workflows/control-center-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/control-center/**"
      - ".github/workflows/control-center-ci.yml"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/control-center

    steps:
      - name: Check out repository branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/control-center/requirements.txt
            apps/control-center/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Apply and commit Ruff fix
        run: |
          ruff check . --fix
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "Apply Ruff auto-fix"
            git push
          fi

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      - name: Compile Python sources
        run: python -m compileall -q .
