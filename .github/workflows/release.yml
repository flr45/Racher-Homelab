name: Release

on:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'apps/control-center/VERSION'
      - 'scripts/**'
      - 'compose/**'
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: SemVer release version without v-prefix
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          set -Eeuo pipefail
          version="${{ github.event.inputs.version || '' }}"
          if [[ -z "$version" && "${GITHUB_EVENT_NAME}" == "push" ]]; then version="${GITHUB_REF_NAME#v}"; fi
          file_version="$(tr -d '[:space:]' < apps/control-center/VERSION)"
          if [[ -z "$version" ]]; then version="$file_version"; fi
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]
          [[ "$version" == "$file_version" ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Run Control Center tests
        working-directory: apps/control-center
        run: |
          python -m pip install -r requirements-dev.txt
          ruff check .
          pytest
          python -m compileall -q .
      - name: Validate installer assets
        run: |
          bash -n scripts/*.sh
          docker compose --env-file .env.example -f compose/data/compose.yml config --quiet
          docker compose --env-file .env.example -f compose/core/compose.yml config --quiet

  release:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build source archive
        run: |
          set -Eeuo pipefail
          mkdir -p dist
          git archive --format=tar.gz --prefix="racher-os-${{ needs.validate.outputs.version }}/" -o "dist/racher-os-${{ needs.validate.outputs.version }}.tar.gz" HEAD
          sha256sum dist/* > dist/SHA256SUMS
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.validate.outputs.version }}
          name: Racher OS v${{ needs.validate.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*
