name: Disaster Recovery Drill

on:
  pull_request:
    paths:
      - 'scripts/disaster-recovery-drill.sh'
      - '.github/workflows/disaster-recovery-drill.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/disaster-recovery-drill.sh'
      - '.github/workflows/disaster-recovery-drill.yml'

permissions:
  contents: read

jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Create synthetic verified backup
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/backup/source
          printf 'test-data\n' > /tmp/backup/source/state.txt
          tar -czf /tmp/backup/control-center-data.tar.gz -C /tmp/backup/source .
          gzip -c /tmp/backup/source/state.txt > /tmp/backup/npm-database.sql.gz
          cat > /tmp/backup/MANIFEST.json <<'JSON'
          {"format_version":1,"created_at":"2026-07-29T00:00:00+00:00","host":"ci"}
          JSON
          cd /tmp/backup
          sha256sum control-center-data.tar.gz npm-database.sql.gz MANIFEST.json > SHA256SUMS
          rm -rf source
      - name: Validate shell syntax
        run: bash -n scripts/disaster-recovery-drill.sh
      - name: Run non-destructive drill
        run: bash scripts/disaster-recovery-drill.sh /tmp/backup
