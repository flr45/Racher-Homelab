name: Refactor Data Services

on:
  push:
    branches:
      - feature/control-center-data-services
    paths:
      - ".github/workflows/refactor-data-services.yml"

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/control-center-data-services

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install development dependencies
        working-directory: apps/control-center
        run: pip install -r requirements-dev.txt

      - name: Apply Ruff fixes
        working-directory: apps/control-center
        run: ruff check . --fix

      - name: Commit result
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/control-center
            git commit -m "Apply Ruff formatting to data services"
            git push
          fi
