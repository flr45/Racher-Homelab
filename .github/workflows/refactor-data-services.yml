name: Refactor Data Services

on:
  push:
    branches:
      - feature/control-center-data-services
    paths:
      - "apps/control-center/tools/refactor_data_services.py"
      - ".github/workflows/refactor-data-services.yml"

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/control-center-data-services

      - name: Apply targeted refactor
        run: python apps/control-center/tools/refactor_data_services.py

      - name: Commit result
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/control-center/app.py
            git commit -m "Extract database audit and event services"
            git push
          fi
