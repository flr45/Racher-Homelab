name: Supply Chain Security

on:
  pull_request:
    paths:
      - "apps/control-center/requirements*.txt"
      - "apps/control-center/Dockerfile"
      - ".github/workflows/supply-chain-security.yml"
      - ".github/dependabot.yml"
  push:
    branches: [main]
    paths:
      - "apps/control-center/requirements*.txt"
      - "apps/control-center/Dockerfile"
      - ".github/workflows/supply-chain-security.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  python-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/control-center
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/control-center/requirements*.txt
      - name: Install audit tooling
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit locked Python dependencies
        run: pip-audit -r requirements.txt -r requirements-dev.txt --strict

  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build local image
        run: docker build --tag racher-control-center:audit apps/control-center
      - name: Scan image
        uses: aquasecurity/trivy-action@0.32.0
        with:
          image-ref: racher-control-center:audit
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Upload scan report
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
