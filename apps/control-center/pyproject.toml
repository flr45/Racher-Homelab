[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "UP017"]

[tool.ruff.lint.per-file-ignores]
"tests/test_deployments.py" = ["E402"]
"services/docker_center_service.py" = ["I001"]
"tests/test_docker_center_extended.py" = ["I001"]
