<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Ordberedskab{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('dashboard') }}">ORD<span>BEREDSKAB</span></a>
    {% if current_user %}
      <nav>
        <a href="{{ url_for('dashboard') }}">Overblik</a>
        <a href="{{ url_for('practice') }}">Øv</a>
        {% if current_user['is_admin'] %}<a href="{{ url_for('admin') }}">Admin</a>{% endif %}
        <a href="{{ url_for('logout') }}">Log ud</a>
      </nav>
    {% endif %}
  </header>

  <main class="page">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
