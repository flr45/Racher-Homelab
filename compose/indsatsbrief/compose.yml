name: racher-homelab-indsatsbrief

services:
  indsatsbrief:
    image: ${INDSATSBRIEF_IMAGE:-ghcr.io/flr45/indsatsbrief-api:latest}
    container_name: indsatsbrief
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    environment:
      TZ: ${TZ:-Europe/Copenhagen}
      FLASK_SECRET_KEY: ${INDSATSBRIEF_FLASK_SECRET_KEY}
      BRIEF_ACCESS_CODE: ${INDSATSBRIEF_ACCESS_CODE}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      OPENAI_API_KEY: ${INDSATSBRIEF_OPENAI_API_KEY}
      OPENAI_MODEL: ${INDSATSBRIEF_OPENAI_MODEL:-gpt-5.4-mini}
      ADMIN_APPROVAL_REQUIRED: ${INDSATSBRIEF_ADMIN_APPROVAL_REQUIRED:-true}
      ADMIN_EMAIL: ${INDSATSBRIEF_ADMIN_EMAIL:-}
      ADMIN_NOTIFY_EMAIL: ${INDSATSBRIEF_ADMIN_NOTIFY_EMAIL:-}
      CONTACT_EMAIL: ${INDSATSBRIEF_CONTACT_EMAIL:-}
      APP_BASE_URL: ${INDSATSBRIEF_APP_BASE_URL:-}
      SHOW_CODE_LOGIN: ${INDSATSBRIEF_SHOW_CODE_LOGIN:-false}
      DANSKADRESSE_API_KEY: ${INDSATSBRIEF_DANSKADRESSE_API_KEY:-}
      DANSKADRESSE_API_BASE: ${INDSATSBRIEF_DANSKADRESSE_API_BASE:-https://api.danskadresseapi.dk/v1}
      DANSKADRESSE_BBR_CACHE_TTL_SECONDS: ${INDSATSBRIEF_DANSKADRESSE_BBR_CACHE_TTL_SECONDS:-86400}
      DANSKADRESSE_FALLBACK_TO_DATAFORDELER: ${INDSATSBRIEF_DANSKADRESSE_FALLBACK_TO_DATAFORDELER:-true}
      DATAFORDELER_API_KEY: ${INDSATSBRIEF_DATAFORDELER_API_KEY:-}
      ADDRESS_CACHE_TTL_SECONDS: ${INDSATSBRIEF_ADDRESS_CACHE_TTL_SECONDS:-3600}
      WEATHER_CACHE_TTL_SECONDS: ${INDSATSBRIEF_WEATHER_CACHE_TTL_SECONDS:-300}
      HYDRANT_CACHE_TTL_SECONDS: ${INDSATSBRIEF_HYDRANT_CACHE_TTL_SECONDS:-900}
      OSM_RISK_CACHE_TTL_SECONDS: ${INDSATSBRIEF_OSM_RISK_CACHE_TTL_SECONDS:-900}
      TRUST_PROXY_HEADERS: ${INDSATSBRIEF_TRUST_PROXY_HEADERS:-true}
      SESSION_COOKIE_SECURE: ${INDSATSBRIEF_SESSION_COOKIE_SECURE:-true}
      SMTP_HOST: ${INDSATSBRIEF_SMTP_HOST:-}
      SMTP_PORT: ${INDSATSBRIEF_SMTP_PORT:-587}
      SMTP_USERNAME: ${INDSATSBRIEF_SMTP_USERNAME:-}
      SMTP_PASSWORD: ${INDSATSBRIEF_SMTP_PASSWORD:-}
      SMTP_FROM: ${INDSATSBRIEF_SMTP_FROM:-}
      SMTP_USE_TLS: ${INDSATSBRIEF_SMTP_USE_TLS:-true}
    networks:
      - backend
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8000/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

networks:
  backend:
    external: true
    name: backend
  proxy:
    external: true
    name: proxy
