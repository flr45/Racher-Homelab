services:
  openwa:
    image: ghcr.io/rmyndharis/openwa:latest
    container_name: racher-sms-openwa
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 2785
      LOG_LEVEL: ${SMS_WHATSAPP_OPENWA_LOG_LEVEL:-info}
      CSP_UPGRADE_INSECURE_REQUESTS: "false"
    volumes:
      - sms_whatsapp_openwa_data:/app/data
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:${SMS_WHATSAPP_OPENWA_PORT:-2785}:2785"
    networks:
      backend:
        aliases:
          - openwa
    pids_limit: 1024
    mem_limit: ${SMS_WHATSAPP_OPENWA_MEM_LIMIT:-768m}
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  sms_whatsapp_openwa_data:
    name: sms-whatsapp_sms_whatsapp_openwa_data

networks:
  backend:
    external: true
