services:
  openwa:
    image: ghcr.io/rmyndharis/openwa:latest
    container_name: racher-sms-openwa
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 2785
      LOG_LEVEL: ${SMS_WHATSAPP_OPENWA_LOG_LEVEL:-info}
      CSP_UPGRADE_INSECURE_REQUESTS: "false"
    volumes:
      - sms_whatsapp_openwa_data:/app/data
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:${SMS_WHATSAPP_OPENWA_PORT:-2785}:2785"
    networks:
      backend:
        aliases:
          - openwa
    pids_limit: 1024
    mem_limit: ${SMS_WHATSAPP_OPENWA_MEM_LIMIT:-768m}
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  sms-whatsapp:
    build:
      context: ../../services/sms-whatsapp
    container_name: racher-sms-whatsapp
    restart: unless-stopped
    depends_on:
      openwa:
        condition: service_started
    environment:
      DATABASE_URL: sqlite:////data/sms-whatsapp.db
      SMS_WHATSAPP_INGEST_TOKEN: ${SMS_WHATSAPP_INGEST_TOKEN:?SMS_WHATSAPP_INGEST_TOKEN must be set}
      SMS_WHATSAPP_ADMIN_USERNAME: ${SMS_WHATSAPP_ADMIN_USERNAME:-admin}
      SMS_WHATSAPP_ADMIN_PASSWORD: ${SMS_WHATSAPP_ADMIN_PASSWORD:?SMS_WHATSAPP_ADMIN_PASSWORD must be set}
      SMS_WHATSAPP_SESSION_SECRET: ${SMS_WHATSAPP_SESSION_SECRET:?SMS_WHATSAPP_SESSION_SECRET must be set}
      SMS_WHATSAPP_COOKIE_SECURE: ${SMS_WHATSAPP_COOKIE_SECURE:-false}
      OPENWA_BASE_URL: ${SMS_WHATSAPP_OPENWA_URL:-http://openwa:2785/api}
      OPENWA_API_KEY: ${SMS_WHATSAPP_OPENWA_API_KEY:?SMS_WHATSAPP_OPENWA_API_KEY must be set}
      OPENWA_SESSION_ID: ${SMS_WHATSAPP_OPENWA_SESSION_ID:?SMS_WHATSAPP_OPENWA_SESSION_ID must be set}
    volumes:
      - sms_whatsapp_data:/data
    ports:
      - "127.0.0.1:${SMS_WHATSAPP_PORT:-8091}:8080"
    networks:
      - backend
      - proxy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true

volumes:
  sms_whatsapp_data:
  sms_whatsapp_openwa_data:

networks:
  backend:
    external: true
  proxy:
    external: true
