name: minutregnskab

services:
  minutregnskab:
    image: ${MINUTREGNSKAB_IMAGE:-ghcr.io/flr45/minutregnskab:latest}
    container_name: minutregnskab
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    environment:
      TZ: ${TZ:-Europe/Copenhagen}
      DATABASE_PATH: /app/data/minutregnskab.db
      SECRET_KEY: ${MINUTREGNSKAB_SECRET_KEY:?MINUTREGNSKAB_SECRET_KEY must be set}
      SESSION_COOKIE_SECURE: ${MINUTREGNSKAB_SESSION_COOKIE_SECURE:-true}
    volumes:
      - minutregnskab_data:/app/data
    expose:
      - "8000"
    networks:
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  proxy:
    external: true

volumes:
  minutregnskab_data:
    name: minutregnskab_data
