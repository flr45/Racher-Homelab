services:
  sms-gateway:
    build:
      context: ../../services/sms-gateway
    container_name: racher-sms-gateway
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:////data/sms-gateway.db
      MODEM_DEVICE: /dev/sbr-sms-modem
      MODEM_BAUDRATE: ${SMS_MODEM_BAUDRATE:-115200}
      MODEM_POLL_SECONDS: ${SMS_MODEM_POLL_SECONDS:-0.5}
      MODEM_STATUS_FILE: /data/modem-status.json
      GATEWAY_STATUS_FILE: /data/gateway-status.json
      DELETE_SMS_AFTER_IMPORT: ${SMS_DELETE_AFTER_IMPORT:-true}
      ALARM_SOURCE_WINDOW_MINUTES: ${SMS_ALARM_SOURCE_WINDOW_MINUTES:-10}
      SMS_DRY_RUN: ${SMS_DRY_RUN:-true}
      VAGTBYTTE_FORWARD_ENABLED: ${VAGTBYTTE_FORWARD_ENABLED:-false}
      VAGTBYTTE_ALARM_FEED_URL: ${VAGTBYTTE_ALARM_FEED_URL:-http://vagtbytte-web:3000/api/alarm-feed/ingest}
      VAGTBYTTE_ALARM_FEED_TOKEN: ${VAGTBYTTE_ALARM_FEED_INGEST_TOKEN}
      SBR_PAGER_INGEST_URL: ${SBR_PAGER_INGEST_URL:-http://sms-whatsapp:8080/api/incoming}
      SBR_PAGER_INGEST_TOKEN: ${SMS_WHATSAPP_INGEST_TOKEN:-}
      SBR_PAGER_PREALERT_DELAY_SECONDS: ${SMS_WHATSAPP_PREALERT_DELAY_SECONDS:-10}
      SBR_PAGER_PARENT_STATE_FILE: /data/sbr-pager-parent-events.json
      SBR_PAGER_PARENT_MAX_AGE_SECONDS: ${SMS_WHATSAPP_PARENT_MAX_AGE_SECONDS:-7200}
      RACHER_MONITOR_SMS_TO: ${RACHER_MONITOR_SMS_TO:-}
      SMS_COMMAND_ALLOWED_NUMBERS: ${SMS_COMMAND_ALLOWED_NUMBERS:-}
      SMS_GATEWAY_API_TOKEN: ${SMS_GATEWAY_API_TOKEN:?SMS_GATEWAY_API_TOKEN must be set}
    devices:
      - ${SMS_MODEM_HOST_DEVICE:-/dev/serial/by-id/usb-HUAWEI_Technology_HUAWEI_Mobile-if00-port0}:/dev/sbr-sms-modem
    group_add:
      - "${DIALOUT_GID:-20}"
    volumes:
      - sms_gateway_data:/data
    # Default remains localhost-only. Set SMS_GATEWAY_BIND_IP to the host's
    # Tailscale IP when the dedicated Pager host needs remote status access.
    ports:
      - "${SMS_GATEWAY_BIND_IP:-127.0.0.1}:${SMS_GATEWAY_PORT:-8090}:8080"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true

volumes:
  sms_gateway_data:

networks:
  backend:
    external: true
