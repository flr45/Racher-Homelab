services:
  sms-gateway:
    build:
      context: ../../services/sms-gateway
    container_name: racher-sms-gateway
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:////data/sms-gateway.db
      MODEM_DEVICE: ${SMS_MODEM_DEVICE:-/dev/ttyUSB1}
      MODEM_BAUDRATE: ${SMS_MODEM_BAUDRATE:-115200}
      MODEM_POLL_SECONDS: ${SMS_MODEM_POLL_SECONDS:-2}
      MODEM_STATUS_FILE: /data/modem-status.json
      GATEWAY_STATUS_FILE: /data/gateway-status.json
      DELETE_SMS_AFTER_IMPORT: ${SMS_DELETE_AFTER_IMPORT:-true}
      ALARM_SOURCE_WINDOW_MINUTES: ${SMS_ALARM_SOURCE_WINDOW_MINUTES:-10}
      SMS_DRY_RUN: ${SMS_DRY_RUN:-true}
      SMS_GATEWAY_API_TOKEN: ${SMS_GATEWAY_API_TOKEN:-}
      VAGTBYTTE_ALARM_FEED_URL: ${VAGTBYTTE_ALARM_FEED_URL:-http://vagtbytte-web:3000/api/alarm-feed/ingest}
      VAGTBYTTE_ALARM_FEED_TOKEN: ${VAGTBYTTE_ALARM_FEED_INGEST_TOKEN}
      RACHER_MONITOR_SMS_TO: ${RACHER_MONITOR_SMS_TO:-}
      SMS_COMMAND_ALLOWED_NUMBERS: ${SMS_COMMAND_ALLOWED_NUMBERS:-}
    devices:
      - ${SMS_MODEM_DEVICE:-/dev/ttyUSB1}:${SMS_MODEM_DEVICE:-/dev/ttyUSB1}
    group_add:
      - "${DIALOUT_GID:-20}"
    volumes:
      - sms_gateway_data:/data
    ports:
      # Behold den eksisterende lokale endpoint til modem/diagnostik.
      - "127.0.0.1:${SMS_GATEWAY_PORT:-8090}:8080"
      # En ekstra bind-adresse kan sættes til original-Pi'ens Tailscale-IP.
      # 127.0.0.2 er en harmløs loopback-standard, så tjenesten er aldrig
      # netværkseksponeret, før SMS_GATEWAY_BIND_HOST sættes eksplicit.
      - "${SMS_GATEWAY_BIND_HOST:-127.0.0.2}:${SMS_GATEWAY_PORT:-8090}:8080"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true

volumes:
  sms_gateway_data:

networks:
  backend:
    external: true
