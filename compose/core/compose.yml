name: racher-homelab-core

services:
  npm-db:
    image: mariadb:11
    container_name: npm-db
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Copenhagen}
      MYSQL_DATABASE: ${NPM_DB_NAME}
      MYSQL_USER: ${NPM_DB_USER}
      MYSQL_PASSWORD: ${NPM_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${NPM_DB_ROOT_PASSWORD}
    volumes:
      - npm_db_data:/var/lib/mysql
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped
    depends_on:
      npm-db:
        condition: service_healthy
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    environment:
      TZ: ${TZ:-Europe/Copenhagen}
      DB_MYSQL_HOST: npm-db
      DB_MYSQL_PORT: 3306
      DB_MYSQL_NAME: ${NPM_DB_NAME}
      DB_MYSQL_USER: ${NPM_DB_USER}
      DB_MYSQL_PASSWORD: ${NPM_DB_PASSWORD}
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    networks:
      - proxy

  portainer:
    image: portainer/portainer-ce:lts
    container_name: portainer
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - proxy

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - proxy

  control-center:
    image: ${CONTROL_CENTER_IMAGE:-ghcr.io/flr45/racher-homelab/control-center:latest}
    container_name: control-center
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    group_add:
      - "${DOCKER_GID:-999}"
    ports:
      - "8080:8080"
    environment:
      TZ: ${TZ:-Europe/Copenhagen}
      RACHER_OS_DATA: /data
      BACKUP_ROOT: /backups
      VAGTBYTTE_URL: ${CONTROL_CENTER_VAGTBYTTE_URL:-#}
      INDSATSBRIEF_URL: ${CONTROL_CENTER_INDSATSBRIEF_URL:-#}
      MINUTREGNSKAB_URL: ${CONTROL_CENTER_MINUTREGNSKAB_URL:-#}
      PORTAINER_URL: ${CONTROL_CENTER_PORTAINER_URL:-https://racher-pi.local:9443}
      UPTIME_KUMA_URL: ${CONTROL_CENTER_UPTIME_KUMA_URL:-#}
      NPM_URL: ${CONTROL_CENTER_NPM_URL:-http://racher-pi.local:81}
      APP_ACTIONS_ENABLED: ${APP_ACTIONS_ENABLED:-false}
      RBAC_ADMIN_EMAILS: ${RBAC_ADMIN_EMAILS:-}
      RBAC_OPERATOR_EMAILS: ${RBAC_OPERATOR_EMAILS:-}
      RBAC_VIEWER_EMAILS: ${RBAC_VIEWER_EMAILS:-}
      RBAC_DEFAULT_ROLE: ${RBAC_DEFAULT_ROLE:-anonymous}
      ALLOWED_ADMIN_EMAILS: ${ALLOWED_ADMIN_EMAILS:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/homelab/data:/data
      - ${HOME}/homelab/backups:/backups
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

networks:
  proxy:
    name: proxy

volumes:
  npm_db_data:
  npm_data:
  npm_letsencrypt:
  portainer_data:
  uptime_kuma_data:
