name: vagtbytte

services:
  vagtbytte-web:
    image: ${VAGTBYTTE_IMAGE:-ghcr.io/flr45/vagtbytte:latest}
    container_name: vagtbytte-web
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    environment:
      TZ: ${TZ:-Europe/Copenhagen}
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      AUTH_SECRET: ${VAGTBYTTE_AUTH_SECRET}
      APP_BASE_URL: ${VAGTBYTTE_APP_BASE_URL:-https://sbr-portal.racher.dk}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${VAGTBYTTE_VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAGTBYTTE_VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAGTBYTTE_VAPID_SUBJECT}
      NOTIFICATIONS_DISABLE_PUSH: ${VAGTBYTTE_DISABLE_PUSH:-false}
      ALARM_FEED_INGEST_TOKEN: ${VAGTBYTTE_ALARM_FEED_INGEST_TOKEN}
      SMS_GATEWAY_HEALTH_URL: ${SMS_GATEWAY_HEALTH_URL:-http://sms-gateway:8080/health}
      BACKUP_DIRECTORY: /data/backups
      BACKUP_AUTO_HOUR: ${VAGTBYTTE_BACKUP_AUTO_HOUR:-3}
      BACKUP_RETENTION_COUNT: ${VAGTBYTTE_BACKUP_RETENTION_COUNT:-30}
      BACKUP_ENCRYPTION_KEY_FILE: /run/secrets/vagtbytte_backup_encryption_key
      SMTP_HOST: ${VAGTBYTTE_SMTP_HOST:-}
      SMTP_PORT: ${VAGTBYTTE_SMTP_PORT:-587}
      SMTP_SECURE: ${VAGTBYTTE_SMTP_SECURE:-false}
      SMTP_STARTTLS: ${VAGTBYTTE_SMTP_STARTTLS:-true}
      SMTP_ALLOW_SELF_SIGNED: ${VAGTBYTTE_SMTP_ALLOW_SELF_SIGNED:-false}
      SMTP_USER: ${VAGTBYTTE_SMTP_USER:-}
      SMTP_PASSWORD: ${VAGTBYTTE_SMTP_PASSWORD:-}
      SMTP_FROM: ${VAGTBYTTE_SMTP_FROM:-}
      SMTP_FROM_NAME: ${VAGTBYTTE_SMTP_FROM_NAME:-SBR Portal}
      SMTP_HELO_NAME: ${VAGTBYTTE_SMTP_HELO_NAME:-sbr-portal.racher.dk}
      BOOTSTRAP_ADMIN_USERNAME: ${VAGTBYTTE_BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${VAGTBYTTE_BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_VC_USERNAME: ${VAGTBYTTE_BOOTSTRAP_VC_USERNAME:-}
      BOOTSTRAP_VC_PASSWORD: ${VAGTBYTTE_BOOTSTRAP_VC_PASSWORD:-}
    command: ["sh", "-c", "npm run db:deploy && node server.js"]
    expose:
      - "3000"
    volumes:
      - vagtbytte_backups:/data/backups
    secrets:
      - vagtbytte_backup_encryption_key
    networks:
      - proxy
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  vagtbytte-worker:
    image: ${VAGTBYTTE_IMAGE:-ghcr.io/flr45/vagtbytte:latest}
    container_name: vagtbytte-worker
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    environment:
      TZ: ${TZ:-Europe/Copenhagen}
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${VAGTBYTTE_VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAGTBYTTE_VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAGTBYTTE_VAPID_SUBJECT}
      NOTIFICATIONS_DISABLE_PUSH: ${VAGTBYTTE_DISABLE_PUSH:-false}
      SMS_GATEWAY_HEALTH_URL: ${SMS_GATEWAY_HEALTH_URL:-http://sms-gateway:8080/health}
      SMS_GATEWAY_MONITOR_INTERVAL_MS: ${SMS_GATEWAY_MONITOR_INTERVAL_MS:-60000}
      BACKUP_DIRECTORY: /data/backups
      BACKUP_AUTO_HOUR: ${VAGTBYTTE_BACKUP_AUTO_HOUR:-3}
      BACKUP_RETENTION_COUNT: ${VAGTBYTTE_BACKUP_RETENTION_COUNT:-30}
      BACKUP_MONITOR_INTERVAL_MS: ${VAGTBYTTE_BACKUP_MONITOR_INTERVAL_MS:-300000}
      BACKUP_ENCRYPTION_KEY_FILE: /run/secrets/vagtbytte_backup_encryption_key
      EMAIL_REPORT_MONITOR_INTERVAL_MS: ${VAGTBYTTE_EMAIL_REPORT_MONITOR_INTERVAL_MS:-60000}
      SMTP_HOST: ${VAGTBYTTE_SMTP_HOST:-}
      SMTP_PORT: ${VAGTBYTTE_SMTP_PORT:-587}
      SMTP_SECURE: ${VAGTBYTTE_SMTP_SECURE:-false}
      SMTP_STARTTLS: ${VAGTBYTTE_SMTP_STARTTLS:-true}
      SMTP_ALLOW_SELF_SIGNED: ${VAGTBYTTE_SMTP_ALLOW_SELF_SIGNED:-false}
      SMTP_USER: ${VAGTBYTTE_SMTP_USER:-}
      SMTP_PASSWORD: ${VAGTBYTTE_SMTP_PASSWORD:-}
      SMTP_FROM: ${VAGTBYTTE_SMTP_FROM:-}
      SMTP_FROM_NAME: ${VAGTBYTTE_SMTP_FROM_NAME:-SBR Portal}
      SMTP_HELO_NAME: ${VAGTBYTTE_SMTP_HELO_NAME:-sbr-portal.racher.dk}
    command: ["sh", "-c", "npm run db:deploy && node scripts/notifications-worker.mjs"]
    volumes:
      - vagtbytte_backups:/data/backups
    secrets:
      - vagtbytte_backup_encryption_key
    healthcheck:
      test: ["NONE"]
    networks:
      - backend

volumes:
  vagtbytte_backups:

secrets:
  vagtbytte_backup_encryption_key:
    file: ${VAGTBYTTE_BACKUP_ENCRYPTION_KEY_FILE:-../../secrets/vagtbytte-backup.key}

networks:
  proxy:
    external: true
  backend:
    external: true
